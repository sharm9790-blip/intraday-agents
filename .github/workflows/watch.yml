name: intraday-watcher

on:
  schedule:
    # Backup only: GitHub delays scheduled runs a lot. The 5-min cadence comes from an
    # external pinger (cron-job.org) calling workflow_dispatch, Mon–Fri 08:40–15:30 IST
    # (from 08:40 so the premarket runs fire at ~08:45 and ~09:08).
    - cron: "*/30 3-10 * * 1-5"
  workflow_dispatch:
  # A new verdict from the cloud debate goes out at once, not at the next 5-min run.
  push:
    branches: [claude/intraday-state]
    paths: [state/plan.json, state/premarket.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: intraday-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check out state branch
        id: state
        run: |
          if git ls-remote --exit-code --heads origin claude/intraday-state >/dev/null; then
            git fetch origin claude/intraday-state
            git worktree add statebr origin/claude/intraday-state
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "no state branch yet"
          fi
      - name: Refresh NSE stock ids (weekly, for INDmoney live prices)
        if: steps.state.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: python3 watcher/nse_ids.py statebr/state
      - name: Refresh liquid-stock universe (weekly, for the code scanner)
        if: steps.state.outputs.ok == 'true' && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 2
        run: python3 watcher/scan.py --refresh statebr/state
      - name: Run watcher
        if: steps.state.outputs.ok == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
          CLAUDE_FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
        run: python3 watcher/watch.py statebr/state
      - name: Save watcher state
        if: steps.state.outputs.ok == 'true'
        run: |
          cd statebr
          git config user.name "intraday-watcher"
          git config user.email "watcher@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            # every file the watcher writes (watch, scorecard, paper, weekly, recheck…):
            # leaving one out makes the rebase below refuse and the save is lost
            git add state/
            git commit -m "watch $(TZ=Asia/Kolkata date +%H:%M)"
            ok=""
            for i in 1 2 3; do
              git pull --rebase origin claude/intraday-state && git push origin HEAD:claude/intraday-state && ok=1 && break
              sleep 3
            done
            [ -n "$ok" ] || { echo "::error::could not save watcher state"; exit 1; }
          fi
      - name: Start My Trade tracker if needed
        if: steps.state.outputs.ok == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (cd watcher && python3 mytrade.py --needed ../statebr/state); then
            gh workflow run mytrade.yml --ref main && echo "started my-trade"
          else
            echo "no open trade or new message"
          fi
