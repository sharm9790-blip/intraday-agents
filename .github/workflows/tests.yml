name: tests

# Offline tests for the watcher, scorecard, paper account, health checks and
# My Trade bot. A red ❌ here means a change broke something — fix before market open.
on:
  push:
    branches: [main]
    paths: ["watcher/**", "tests/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
